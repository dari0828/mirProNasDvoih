<!DOCTYPE html>

</head>
<body>

<audio id="bg-music" src="../audio/melody.mp3" loop preload="auto"></audio>

<header class="site-header">
  <a href="../index.html" class="back">← назад</a>
  <span class="brand">между строк</span>
</header>

<main class="page">
  <h1 class="page-title">ты</h1>

  <div class="words-cloud reveal">
    <span class="word-item" data-key="vrednaya">вредная</span>
    <span class="word-item" data-key="nezhnaya">нежная</span>
    <span class="word-item" data-key="smeshnaya">смешная</span>
    <span class="word-item" data-key="kapriznaya">капризная</span>
    <span class="word-item" data-key="krasivaya">красивая</span>
    <span class="word-item" data-key="lyubimaya">моя любимая</span>
  </div>

  <nav class="page-nav">
    <a href="../index.html">← главная</a>
    <a href="my.html">мы →</a>
  </nav>
</main>

<div class="word-modal" id="word-modal" hidden>
  <div class="word-modal-inner">
    <h2></h2>
    <div class="word-modal-content"></div>
    <button class="word-modal-close" id="word-modal-close">закрыть ✕</button>
  </div>
</div>

<template id="tpl-vrednaya">
  <p>Ты прекрасно знаешь, как меня подразнить.</p>
  <p>И, кажется, тебе это нравится.</p>
</template>

<template id="tpl-nezhnaya">
  <p>Ты умеешь быть нежной так, что это чувствуется даже в коротком «привет».</p>
  <p>И я это храню.</p>
</template>

<template id="tpl-smeshnaya">
  <p>С тобой я смеюсь так, как не смеюсь больше ни с кем.</p>
  <p>И это — лучшее.</p>
</template>

<template id="tpl-kapriznaya">
  <video src="../videos/kotyonok.mp4" autoplay muted loop playsinline class="word-video"></video>
  <p>И всё равно самая любимая.</p>
</template>

<template id="tpl-krasivaya">
  <p>Ты красивая так, что иногда я просто молчу.</p>
  <p>Потому что словами это не передать.</p>
</template>

<template id="tpl-lyubimaya">
  <p>Моя любимая. Самая.</p>
  <p>Даже когда далеко. Даже когда молчишь.</p>
</template>

<button class="easter egg-1" id="egg-diamond" aria-label="secret">♢</button>

<div class="secret-overlay" id="secret-diamond" hidden>
  <div class="secret-inner">
    <p>О, ты нашла ещё одну.</p>
    <p class="secret-big">тот самый непослушный рыжий котёнок</p>
    <p>да, это ты. и я всё равно тебя люблю.</p>
    <button class="secret-back" id="secret-diamond-close">← вернуться</button>
  </div>
</div>
